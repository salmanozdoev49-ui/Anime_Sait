<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мираж Anime</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #08090d;
    color: #fff;
    font-family: Arial, sans-serif;
}

button,
input,
select {
    font-family: inherit;
}

/* ================= HEADER ================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8, 9, 13, 0.94);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid #1d2028;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.menu-toggle-btn {
    width: 42px;
    height: 42px;
    background: #11131a;
    border: 1px solid #252832;
    border-radius: 10px;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.menu-toggle-btn:hover {
    background: #1d2029;
    border-color: #414450;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
}

.logo span {
    color: #c9cbd0;
}

/* ================= SIDEBAR MENU ================= */

.sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    z-index: 400;
    display: none;
}

.sidebar-overlay.show {
    display: block;
}

.sidebar {
    position: fixed;
    top: 0;
    left: -280px;
    width: 280px;
    height: 100%;
    background: #101219;
    border-right: 1px solid #22252e;
    z-index: 401;
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: left 0.3s ease;
    overflow-y: auto;
}

.sidebar.open {
    left: 0;
}

.sidebar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #1e212a;
}

.sidebar-title {
    font-weight: bold;
    font-size: 18px;
    color: #d4d5d8;
}

.sidebar-close {
    background: none;
    border: none;
    color: #888b95;
    font-size: 20px;
    cursor: pointer;
}

.sidebar-item {
    background: transparent;
    border: 0;
    color: #b0b3bc;
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    text-align: left;
    width: 100%;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.sidebar-item:hover,
.sidebar-item.active {
    background: #181a22;
    color: #fff;
}

.sidebar-hr {
    border: 0;
    height: 1px;
    background: #20232c;
    margin: 8px 0;
}

.sidebar-subitem {
    background: transparent;
    border: 0;
    color: #838793;
    padding: 10px 14px 10px 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    text-align: left;
    width: 100%;
    transition: 0.2s;
}

.sidebar-subitem:hover {
    background: #151720;
    color: #d4d5d8;
}

.submenu {
    display: none;
    flex-direction: column;
    gap: 4px;
}

.submenu.show {
    display: flex;
}

/* ================= MAIN ================= */

main {
    max-width: 1200px;
    margin: auto;
    padding: 20px 20px 60px;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

/* ================= HERO ================= */

.hero {
    padding: 10px 0 25px;
}

.hero-title {
    text-align: center;
    margin-bottom: 20px;
}

.hero-title h1 {
    position: relative;
    display: inline-block;
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 1px;
    background: linear-gradient(
        110deg,
        #777a82,
        #f4f4f5,
        #858891,
        #ffffff,
        #777a82
    );
    background-size: 250% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: silverShine 5s linear infinite;
}

@keyframes silverShine {
    0% { background-position: 250% center; }
    100% { background-position: -250% center; }
}

.hero-subtitle {
    color: #777b86;
    font-size: 14px;
    margin-top: 6px;
}

/* ================= SEARCH & FILTERS ================= */

.search-area {
    max-width: 720px;
    margin: auto;
}

.search-wrapper {
    display: flex;
    gap: 8px;
    width: 100%;
}

.search {
    flex: 1;
    min-width: 0;
    height: 46px;
    padding: 0 15px;
    background: #11131a;
    border: 1px solid #252832;
    border-radius: 12px;
    outline: none;
    color: #fff;
    font-size: 14px;
}

.search::placeholder { color: #696d78; }
.search:focus { border-color: #676a73; }

.filter-search-btn {
    width: 46px;
    min-width: 46px;
    height: 46px;
    border-radius: 12px;
    background: #11131a;
    border: 1px solid #252832;
    color: #d4d5d8;
    font-size: 19px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.filter-search-btn:hover,
.filter-search-btn.active {
    background: #252831;
    border-color: #555861;
}

.filter-panel {
    display: none;
    margin-top: 10px;
    padding: 18px;
    background: #101219;
    border: 1px solid #292c35;
    border-radius: 15px;
}

.filter-panel.show { display: block; }

.filter-group { margin-bottom: 18px; }
.filter-group:last-child { margin-bottom: 0; }

.filter-group-title {
    color: #b7bac2;
    font-size: 13px;
    margin-bottom: 10px;
    font-weight: bold;
}

.filter-options {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.filter-option {
    background: #191c23;
    border: 1px solid #292c34;
    color: #92959e;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    transition: 0.2s;
}

.filter-option:hover { background: #23262f; color: #fff; }
.filter-option.selected { background: #d2d3d6; border-color: #d2d3d6; color: #08090d; }

.filter-actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #242730;
}

.filter-search {
    flex: 1; border: 0; padding: 11px; border-radius: 9px;
    background: #d4d5d8; color: #08090d; cursor: pointer; font-weight: bold;
}

.filter-reset {
    flex: 1; border: 1px solid #2b2e37; padding: 11px; border-radius: 9px;
    background: #181a21; color: #aaaeb7; cursor: pointer;
}

.filter-reset:hover { background: #22252d; color: #fff; }

/* ================= GRID & CARDS ================= */

.anime-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
    margin-top: 25px;
}

.card {
    position: relative;
    background: #101219;
    border: 1px solid #1e212a;
    border-radius: 11px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.25s, border-color 0.25s;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #41444e;
}

.poster-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    overflow: hidden;
    background: #161820;
}

.poster {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s;
}

.card:hover .poster { transform: scale(1.03); }

.card-rating {
    position: absolute;
    top: 7px;
    left: 7px;
    min-width: 38px;
    height: 22px;
    padding: 0 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(100, 103, 109, 0.92);
    border-radius: 4px;
    color: #ffd83d;
    font-size: 11px;
    font-weight: bold;
    z-index: 2;
}

.favorite {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 3;
}

.favorite.active { color: #ffd83d; }

.card-info { padding: 9px 8px 10px; }

.card-title {
    color: #cfd1d5;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    text-align: center;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    color: #6f727d;
    padding: 60px 20px;
}

.empty-icon { font-size: 42px; margin-bottom: 12px; }

/* ================= FAVORITES ================= */

.favorites-header { margin-bottom: 22px; }
.favorites-header h2 { margin: 0 0 15px; font-size: 25px; color: #d2d3d6; }

.status-filters {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 5px;
}

.status-filters::-webkit-scrollbar { display: none; }

.status-btn {
    flex-shrink: 0;
    padding: 8px 12px;
    background: #11131a;
    border: 1px solid #292c34;
    color: #888c97;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
}

.status-btn.active {
    background: #d3d4d7;
    border-color: #d3d4d7;
    color: #08090d;
}

/* ================= PROFILE & PAGES ================= */

.profile-page { max-width: 720px; margin: auto; }
.profile-title { text-align: center; font-size: 28px; margin: 5px 0 24px; color: #d3d4d7; }

.profile-card {
    background: #101219;
    border: 1px solid #22252e;
    border-radius: 18px;
    padding: 28px 20px;
}

.profile-avatar-wrapper { text-align: center; margin-bottom: 25px; }

.profile-avatar {
    width: 110px; height: 110px; border-radius: 50%;
    object-fit: cover; display: block; margin: auto;
    background: #1a1c23; border: 2px solid #3a3d46;
}

.avatar-button {
    margin-top: 12px; background: #1b1e25; border: 1px solid #30333c;
    color: #bfc1c7; padding: 9px 14px; border-radius: 9px; cursor: pointer; display: inline-block;
}

.avatar-button:hover { background: #252831; }

.profile-info { border-top: 1px solid #242730; border-bottom: 1px solid #242730; padding: 8px 0; }
.profile-row { display: flex; justify-content: space-between; gap: 20px; padding: 14px 4px; border-bottom: 1px solid #1e2129; }
.profile-row:last-child { border-bottom: 0; }
.profile-label { color: #777b86; font-size: 14px; }
.profile-value { color: #d0d1d5; font-size: 14px; text-align: right; }

.project-news { padding: 13px; background: #171920; border-radius: 10px; margin-bottom: 8px; }
.news-title { color: #d5d6d9; font-size: 14px; margin-bottom: 5px; }
.news-date { color: #686c77; font-size: 11px; }

.friends-list { display: flex; flex-direction: column; gap: 8px; }
.friend-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: #171920; border-radius: 10px; cursor: pointer; }
.friend-avatar { width: 43px; height: 43px; border-radius: 50%; object-fit: cover; background: #242730; }
.friend-name { color: #d2d3d7; font-size: 14px; font-weight: 600; }
.friend-status { color: #70747e; font-size: 11px; margin-top: 3px; }

.add-friend-button {
    width: 100%; margin-top: 10px; padding: 12px; border: 1px solid #30333c;
    background: #191c23; color: #c5c7cc; border-radius: 10px; cursor: pointer;
}

.auth-btn {
    padding: 10px 18px; border-radius: 10px; border: 1px solid #2a2d35;
    background: #12141a; color: #fff; cursor: pointer; transition: 0.2s;
}

/* ================= MODAL ================= */

.modal {
    position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.78);
    backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 18px;
}

.modal.show { display: flex; }

.modal-box {
    width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto;
    background: #101219; border: 1px solid #292c35; border-radius: 18px; padding: 22px;
}

.modal-header { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 18px; }
.modal-header h2 { margin: 0; color: #d3d4d8; font-size: 21px; }

.close-button {
    width: 34px; height: 34px; border: 0; border-radius: 50%;
    background: #20232b; color: #fff; cursor: pointer; font-size: 15px;
}

.anime-details { display: flex; gap: 20px; }
.anime-details-poster { width: 170px; height: 255px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
.anime-details-info { flex: 1; }
.anime-meta { color: #9a9da6; font-size: 13px; line-height: 1.8; }
.anime-meta strong { color: #d0d1d5; }
.anime-description { margin-top: 15px; color: #8b8f99; font-size: 13px; line-height: 1.6; }

.status-select {
    width: 100%; margin-top: 15px; padding: 11px; background: #191c23;
    border: 1px solid #2b2e37; color: #d0d1d5; border-radius: 9px; outline: none;
}

.comments-box { margin-top: 22px; padding-top: 20px; border-top: 1px solid #252832; }
.comments-title { color: #d2d3d7; font-size: 16px; font-weight: bold; margin-bottom: 12px; }
.comment-input-wrapper { display: flex; gap: 7px; }
.comment-input { flex: 1; min-width: 0; padding: 10px 12px; background: #191c23; border: 1px solid #292c35; border-radius: 8px; color: #fff; outline: none; }
.comment-button { padding: 0 14px; border: 0; border-radius: 8px; background: #d2d3d6; color: #08090d; cursor: pointer; font-weight: bold; }
.comments-list { margin-top: 13px; }
.comment { background: #171920; border-radius: 9px; padding: 10px; margin-bottom: 7px; }
.comment-user { color: #d0d1d5; font-size: 12px; font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; }
.comment-date { color: #686c77; font-weight: normal; font-size: 11px; }
.comment-text { color: #888c96; font-size: 13px; line-height: 1.4; }

.auth-content { text-align: center; }
.auth-logo { font-size: 25px; font-weight: bold; margin-bottom: 6px; color: #d3d4d8; }
.auth-subtitle { color: #717580; font-size: 13px; margin-bottom: 18px; }
.auth-input { width: 100%; padding: 12px; margin-bottom: 9px; background: #191c23; border: 1px solid #2b2e37; border-radius: 9px; color: white; outline: none; }
.auth-submit { width: 100%; padding: 12px; margin-top: 5px; border: 0; border-radius: 9px; background: #d4d5d8; color: #08090d; cursor: pointer; font-weight: bold; }

/* ================= RESPONSIVE ================= */

@media (max-width: 1050px) {
    .anime-grid { grid-template-columns: repeat(5, 1fr); }
}

@media (max-width: 850px) {
    .anime-grid { grid-template-columns: repeat(4, 1fr); gap: 12px; }
}

@media (max-width: 600px) {
    .anime-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .hero-title h1 { font-size: 26px; }
    .anime-details { flex-direction: column; }
    .anime-details-poster { width: 130px; height: 195px; margin: auto; }
}

@media (max-width: 420px) {
    .anime-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
}
</style>
</head>

<body>

<!-- ================= SIDEBAR MENU ================= -->

<div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-title">Меню</div>
        <button class="sidebar-close" onclick="closeSidebar()">✕</button>
    </div>

    <!-- Блок авторизации в меню -->
    <div id="sidebarAuthArea">
        <button class="sidebar-item" onclick="openAuth('login'); closeSidebar();">🔑 Вход</button>
        <button class="sidebar-item" onclick="openAuth('register'); closeSidebar();">📝 Регистрация</button>
    </div>

    <hr class="sidebar-hr">

    <!-- Пункты меню -->
    <button class="sidebar-item active" onclick="showSection('home', this); closeSidebar();">
        🏠 Главная
    </button>

    <button class="sidebar-item" onclick="toggleSubmenu('favSubmenu')">
        ⭐ Избранное <span>▼</span>
    </button>
    <div id="favSubmenu" class="submenu">
        <button class="sidebar-subitem" onclick="showFavoritesWithStatus('all')">Все категории</button>
        <button class="sidebar-subitem" onclick="showFavoritesWithStatus('Смотрю')">👀 Смотрю</button>
        <button class="sidebar-subitem" onclick="showFavoritesWithStatus('Просмотрено')">✅ Просмотрено</button>
        <button class="sidebar-subitem" onclick="showFavoritesWithStatus('Планирую')">📌 Планирую</button>
        <button class="sidebar-subitem" onclick="showFavoritesWithStatus('Брошено')">⏸️ Брошено</button>
    </div>

    <button class="sidebar-item" onclick="showSection('profile', this); closeSidebar();">
        👤 Профиль
    </button>

    <button class="sidebar-item" onclick="showSection('news-page', this); closeSidebar();">
        📰 Новости
    </button>

    <button class="sidebar-item" onclick="showSection('friends-page', this); closeSidebar();">
        👥 Друзья
    </button>
</div>

<!-- ================= HEADER ================= -->

<header>
    <div class="header-inner">
        <button class="menu-toggle-btn" onclick="toggleSidebar()" title="Меню">☰</button>
        <div class="logo">
            ✦ <span>Мираж</span> Anime
        </div>
    </div>
</header>

<!-- ================= MAIN ================= -->

<main>

<!-- HOME SECTION -->
<section id="home" class="section active">
    <div class="hero">
        <div class="hero-title">
            <h1>Мираж Anime</h1>
            <div class="hero-subtitle">Твоя коллекция аниме</div>
        </div>

        <div class="search-area">
            <div class="search-wrapper">
                <input
                    id="homeSearch"
                    class="search"
                    type="text"
                    placeholder="🔍 Найти аниме..."
                    oninput="searchAnime(this.value)"
                >
                <button
                    id="filterSearchButton"
                    class="filter-search-btn"
                    onclick="toggleFilterPanel()"
                    title="Фильтр"
                >⚙</button>
            </div>

            <div id="filterPanel" class="filter-panel">
                <div class="filter-group">
                    <div class="filter-group-title">Тип</div>
                    <div class="filter-options">
                        <button class="filter-option" data-filter-type="type" data-value="TV" onclick="selectFilter('type','TV',this)">TV сериалы</button>
                        <button class="filter-option" data-filter-type="type" data-value="Фильм" onclick="selectFilter('type','Фильм',this)">Фильмы</button>
                        <button class="filter-option" data-filter-type="type" data-value="OVA" onclick="selectFilter('type','OVA',this)">OVA</button>
                        <button class="filter-option" data-filter-type="type" data-value="ONA" onclick="selectFilter('type','ONA',this)">ONA</button>
                        <button class="filter-option" data-filter-type="type" data-value="Анонс" onclick="selectFilter('type','Анонс',this)">Анонсы</button>
                        <button class="filter-option" data-filter-type="type" data-value="Онгоинг" onclick="selectFilter('type','Онгоинг',this)">Онгоинги</button>
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-group-title">Жанры</div>
                    <div class="filter-options">
                        <button class="filter-option" data-filter-type="genre" data-value="Детектив" onclick="selectFilter('genre','Детектив',this)">Детектив</button>
                        <button class="filter-option" data-filter-type="genre" data-value="Драма" onclick="selectFilter('genre','Драма',this)">Драма</button>
                        <button class="filter-option" data-filter-type="genre" data-value="Комедия" onclick="selectFilter('genre','Комедия',this)">Комедия</button>
                        <button class="filter-option" data-filter-type="genre" data-value="Фэнтези" onclick="selectFilter('genre','Фэнтези',this)">Фэнтези</button>
                        <button class="filter-option" data-filter-type="genre" data-value="Экшен" onclick="selectFilter('genre','Экшен',this)">Экшен</button>
                        <button class="filter-option" data-filter-type="genre" data-value="Романтика" onclick="selectFilter('genre','Романтика',this)">Романтика</button>
                    </div>
                </div>

                <div class="filter-group">
                    <div class="filter-group-title">Годы</div>
                    <div class="filter-options">
                        <button class="filter-option" data-filter-type="year" data-value="2000-2010" onclick="selectFilter('year','2000-2010',this)">2000–2010</button>
                        <button class="filter-option" data-filter-type="year" data-value="2011-2020" onclick="selectFilter('year','2011-2020',this)">2011–2020</button>
                        <button class="filter-option" data-filter-type="year" data-value="2021-2026" onclick="selectFilter('year','2021-2026',this)">2021–2026</button>
                    </div>
                </div>

                <div class="filter-actions">
                    <button class="filter-search" onclick="applyFilters()">🔎 Искать</button>
                    <button class="filter-reset" onclick="resetFilters()">↻ Сбросить</button>
                </div>
            </div>
        </div>
    </div>

    <div id="homeGrid" class="anime-grid"></div>
</section>

<!-- FAVORITES SECTION -->
<section id="favorites" class="section">
    <div class="favorites-header">
        <h2>⭐ Избранное</h2>
        <div class="status-filters">
            <button class="status-btn active" data-status="all" onclick="filterStatus('all', this)">Все</button>
            <button class="status-btn" data-status="Смотрю" onclick="filterStatus('Смотрю', this)">👀 Смотрю</button>
            <button class="status-btn" data-status="Просмотрено" onclick="filterStatus('Просмотрено', this)">✅ Просмотрено</button>
            <button class="status-btn" data-status="Планирую" onclick="filterStatus('Планирую', this)">📌 Планирую</button>
            <button class="status-btn" data-status="Брошено" onclick="filterStatus('Брошено', this)">⏸️ Брошено</button>
        </div>
    </div>

    <div id="favoritesGrid" class="anime-grid"></div>
</section>

<!-- PROFILE SECTION -->
<section id="profile" class="section">
    <div class="profile-page">
        <h2 class="profile-title">Профиль</h2>
        <div class="profile-card">
            <div class="profile-avatar-wrapper">
                <img id="profileAvatar" class="profile-avatar" src="https://i.imgur.com/6VBx3io.png" alt="Аватар">
                <br>
                <label class="avatar-button" for="avatarInput">🖼️ Выбрать аватар</label>
                <input id="avatarInput" type="file" accept="image/*" style="display:none" onchange="changeAvatar(event)">
            </div>

            <div class="profile-info">
                <div class="profile-row">
                    <span class="profile-label">Дата регистрации</span>
                    <span id="registrationDate" class="profile-value">—</span>
                </div>
                <div class="profile-row">
                    <span class="profile-label">Имя пользователя</span>
                    <span id="profileUsername" class="profile-value">Гость</span>
                </div>
            </div>

            <div style="margin-top: 20px; text-align: center;" id="profileLogoutArea">
                <button class="auth-btn" style="width: 100%; border-color: #582121; background: #231212; color: #ff8585;" onclick="logout()">
                    🚪 Выйти из аккаунта
                </button>
            </div>
        </div>
    </div>
</section>

<!-- NEWS PAGE -->
<section id="news-page" class="section">
    <div class="profile-page">
        <h2 class="profile-title">📰 Новости проекта</h2>
        <div id="projectNewsList">
            <div class="project-news">
                <div class="news-title">Загрузка новостей...</div>
            </div>
        </div>
    </div>
</section>

<!-- FRIENDS PAGE -->
<section id="friends-page" class="section">
    <div class="profile-page">
        <h2 class="profile-title">👥 Друзья</h2>
        <div class="profile-card">
            <div id="friendsList" class="friends-list"></div>
            <button class="add-friend-button" onclick="openFriendAdd()">+ Добавить друга</button>
        </div>

</section>

</main>

<!-- ================= MODALS ================= -->

<div id="animeModal" class="modal" onclick="closeAnimeOutside(event)">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="animeModalTitle">Аниме</h2>
            <button class="close-button" onclick="closeAnimeModal()">✕</button>
        </div>

        <div class="anime-details">
            <img id="animeModalPoster" class="anime-details-poster" src="" alt="">
            <div class="anime-details-info">
                <div id="animeModalMeta" class="anime-meta"></div>
                <div id="animeModalDescription" class="anime-description"></div>

                <select id="animeStatus" class="status-select" onchange="changeAnimeStatus()">
                    <option value="">+ Добавить в избранное</option>
                    <option value="Смотрю">👀 Смотрю</option>
                    <option value="Просмотрено">✅ Просмотрено</option>
                    <option value="Брошено">⏸️ Брошено</option>
                    <option value="Планирую">📌 Планирую</option>
                </select>
            </div>
        </div>

        <div class="comments-box">
            <div class="comments-title">💬 Комментарии</div>
            <div class="comment-input-wrapper">
                <input id="commentInput" class="comment-input" type="text" placeholder="Написать комментарий...">
                <button class="comment-button" onclick="addComment()">Отправить</button>
            </div>
            <div id="commentsList" class="comments-list"></div>
        </div>
    </div>
</div>

<div id="authModal" class="modal">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="authModalTitle">Войти</h2>
            <button class="close-button" onclick="closeAuth()">✕</button>
        </div>

        <div class="auth-content">
            <div class="auth-logo">Мираж Anime</div>
            <div class="auth-subtitle">Введите данные для продолжения</div>

            <input id="authUsername" class="auth-input" type="text" placeholder="Имя пользователя">
            <input id="authEmail" class="auth-input" type="email" placeholder="Email (необязательно)">
            <input id="authPassword" class="auth-input" type="password" placeholder="Пароль">

            <button id="authSubmit" class="auth-submit" onclick="submitAuth()">Войти</button>
        </div>
    </div>
</div>

<div id="friendModal" class="modal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>Добавить друга</h2>
            <button class="close-button" onclick="closeFriendModal()">✕</button>
        </div>
        <input id="friendNameInput" class="auth-input" type="text" placeholder="Имя пользователя">
        <button class="auth-submit" onclick="addFriend()">Добавить друга</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://oitfdsoryrxlzgmqhqrq.supabase.co";
const SUPABASE_KEY = "sb_publishable_umItz7Y1LhxpgkYj4o7DsA_U9utqT8X";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let animeList = [];
let userFavorites = {};
let currentUser = null;
let selectedFilters = { type: "", genre: "", year: "" };
let currentAnime = null;
let currentStatus = "all";

function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("show");
}

function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("show");
}

function toggleSubmenu(id) {
    document.getElementById(id).classList.toggle("show");
}

function showFavoritesWithStatus(status) {
    showSection('favorites');
    const btn = document.querySelector(`.status-btn[data-status="${status}"]`);
    if (btn) filterStatus(status, btn);
    closeSidebar();
}

async function initUserSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && session.user) {
        const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
        currentUser = profile || { id: session.user.id, username: session.user.email.split('@')[0], avatar_url: 'https://i.imgur.com/6VBx3io.png' };
    } else {
        currentUser = null;
    }
    updateAuthUI();
    await loadUserFavorites();
}

function updateAuthUI() {
    const sidebarAuth = document.getElementById("sidebarAuthArea");
    const logoutBtn = document.getElementById("profileLogoutArea");

    if (currentUser) {
        if (sidebarAuth) {
            sidebarAuth.innerHTML = `
                <div style="padding: 10px 14px; color: #888b95; font-size: 13px;">
                    Вы вошли как: <strong style="color: #fff;">${currentUser.username}</strong>
                </div>
                <button class="sidebar-item" onclick="logout(); closeSidebar();" style="color: #ff7575;">🚪 Выйти</button>
            `;
        }
        if (logoutBtn) logoutBtn.style.display = "block";
    } else {
        if (sidebarAuth) {
            sidebarAuth.innerHTML = `
                <button class="sidebar-item" onclick="openAuth('login'); closeSidebar();">🔑 Вход</button>
                <button class="sidebar-item" onclick="openAuth('register'); closeSidebar();">📝 Регистрация</button>
            `;
        }
        if (logoutBtn) logoutBtn.style.display = "none";
    }
}

async function loadAnime() {
    const grid = document.getElementById("homeGrid");
    if (grid) grid.innerHTML = '<div class="empty">Загрузка каталога...</div>';

    const { data, error } = await supabaseClient.from("anime").select("*").order("title", { ascending: true });
    if (error) {
        if (grid) grid.innerHTML = '<div class="empty">⚠️ Ошибка загрузки</div>';
        return;
    }

    animeList = (data || []).map(a => ({
        ...a,
        genres: Array.isArray(a.genres) ? a.genres : (typeof a.genres === "string" ? a.genres.split(",").map(g => g.trim()) : [])
    }));

    renderHome();
    renderFavorites();
}

async function loadUserFavorites() {
    userFavorites = {};
    if (!currentUser) return;

    const { data } = await supabaseClient.from("user_favorites").select("anime_id, status").eq("user_id", currentUser.id);
    if (data) data.forEach(i => { userFavorites[i.anime_id] = i.status; });
    renderFavorites();
}

function createCard(anime) {
    const card = document.createElement("div");
    card.className = "card";
    const status = userFavorites[anime.id] || "";
    card.onclick = () => openAnime(anime.id);

    card.innerHTML = `
        <div class="poster-wrapper">
            <img class="poster" src="${anime.poster}" alt="${anime.title}">
            <div class="card-rating">${anime.rating}</div>
            <button class="favorite ${status ? "active" : ""}" onclick="toggleFavorite(event, ${anime.id})">${status ? "★" : "☆"}</button>
        </div>
        <div class="card-info">
            <div class="card-title">${anime.title}</div>
        </div>
    `;
    return card;
}

function renderHome(list = animeList) {
    const grid = document.getElementById("homeGrid");
    if (!grid) return;
    grid.innerHTML = list.length ? "" : '<div class="empty">Ничего не найдено</div>';
    list.forEach(anime => grid.appendChild(createCard(anime)));
}

function searchAnime(value) {
    const text = value.toLowerCase().trim();
    renderHome(text ? animeList.filter(a => a.title.toLowerCase().includes(text)) : animeList);
}

function toggleFilterPanel() {
    document.getElementById("filterPanel").classList.toggle("show");
}

function selectFilter(type, value, button) {
    selectedFilters[type] = value;
    document.querySelectorAll(`[data-filter-type="${type}"]`).forEach(i => i.classList.remove("selected"));
    button.classList.add("selected");
}

function applyFilters() {
    let results = animeList.filter(anime => {
        const matchesType = !selectedFilters.type || anime.type === selectedFilters.type;
        const matchesGenre = !selectedFilters.genre || anime.genres.includes(selectedFilters.genre);
        return matchesType && matchesGenre;
    });
    renderHome(results);
    document.getElementById("filterPanel").classList.remove("show");
}

function resetFilters() {
    selectedFilters = { type: "", genre: "", year: "" };
    document.querySelectorAll(".filter-option").forEach(b => b.classList.remove("selected"));
    renderHome();
}

async function toggleFavorite(event, id) {
    event.stopPropagation();
    if (!currentUser) return alert("Войдите в профиль!");

    if (userFavorites[id]) {
        delete userFavorites[id];
        await supabaseClient.from("user_favorites").delete().eq("user_id", currentUser.id).eq("anime_id", id);
    } else {
        userFavorites[id] = "Планирую";
        await supabaseClient.from("user_favorites").upsert({ user_id: currentUser.id, anime_id: id, status: "Планирую" });
    }
    renderHome();
    renderFavorites();
}

function renderFavorites() {
    const grid = document.getElementById("favoritesGrid");
    if (!grid) return;
    let list = animeList.filter(a => userFavorites[a.id]);
    if (currentStatus !== "all") list = list.filter(a => userFavorites[a.id] === currentStatus);
    grid.innerHTML = list.length ? "" : '<div class="empty">Список пуст</div>';
    list.forEach(anime => grid.appendChild(createCard(anime)));
}

function filterStatus(status, button) {
    currentStatus = status;
    document.querySelectorAll(".status-btn").forEach(i => i.classList.remove("active"));
    if (button) button.classList.add("active");
    renderFavorites();
}

function showSection(sectionId) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.getElementById(sectionId).classList.add("active");
    if (sectionId === "favorites") renderFavorites();
    if (sectionId === "profile") loadProfile();
}

function openAnime(id) {
    currentAnime = animeList.find(a => a.id === id);
    if (!currentAnime) return;
    document.getElementById("animeModalTitle").textContent = currentAnime.title;
    document.getElementById("animeModalPoster").src = currentAnime.poster;
    document.getElementById("animeStatus").value = userFavorites[id] || "";
    document.getElementById("animeModal").classList.add("show");
}

function closeAnimeModal() { document.getElementById("animeModal").classList.remove("show"); }
function closeAnimeOutside(e) { if (e.target.id === "animeModal") closeAnimeModal(); }

async function changeAnimeStatus() {
    if (!currentAnime || !currentUser) return;
    const value = document.getElementById("animeStatus").value;
    if (value) {
        userFavorites[currentAnime.id] = value;
        await supabaseClient.from("user_favorites").upsert({ user_id: currentUser.id, anime_id: currentAnime.id, status: value });
    } else {
        delete userFavorites[currentAnime.id];
        await supabaseClient.from("user_favorites").delete().eq("user_id", currentUser.id).eq("anime_id", currentAnime.id);
    }
    renderHome();
    renderFavorites();
}

function loadProfile() {
    if (currentUser) {
        document.getElementById("profileUsername").textContent = currentUser.username;
        document.getElementById("profileAvatar").src = currentUser.avatar_url || "https://i.imgur.com/6VBx3io.png";
    }
}

let authMode = "login";
function openAuth(mode) {
    authMode = mode;
    document.getElementById("authModalTitle").textContent = mode === "register" ? "Регистрация" : "Войти";
    document.getElementById("authModal").classList.add("show");
}
function closeAuth() { document.getElementById("authModal").classList.remove("show"); }

async function submitAuth() {
    const username = document.getElementById("authUsername").value.trim();
    const password = document.getElementById("authPassword").value.trim();
    if (!username || !password) return alert("Заполните поля");

    const email = `${username.toLowerCase()}@mirage.app`;
    if (authMode === "register") {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) return alert(error.message);
        if (data.user) {
            await supabaseClient.from('profiles').insert([{ id: data.user.id, username }]);
            currentUser = { id: data.user.id, username };
        }
    } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) return alert("Неверный логин/пароль");
        const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();
        currentUser = profile;
    }
    updateAuthUI();
    loadProfile();
    await loadUserFavorites();
    closeAuth();
}

async function logout() {
    await supabaseClient.auth.signOut();
    currentUser = null;
    updateAuthUI();
    loadProfile();
    renderFavorites();
}

document.addEventListener("DOMContentLoaded", async () => {
    await initUserSession();
    await loadAnime();
});
</script>
</body>
</html>
